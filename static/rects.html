<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rectangle Map Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
        }
        .rectangle-label {
            background-color: white;
            border: 1px solid black;
            padding: 2px 5px;
            font-size: 12px;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="drawRectBtn" disabled>Draw Rectangle</button>
        <button id="saveRectanglesBtn" disabled>Save Rectangles</button>
        <span id="status" role="status">Loading map…</span>
    </div>

    <script>
    (function() {
        let map;
        let rectangles = [];
        let drawing = false;
        let drawingStart = null;
        let currentDrawing = null;
        let loaded = false;
        let saving = false;
        const drawButton = document.getElementById('drawRectBtn');
        const saveButton = document.getElementById('saveRectanglesBtn');
        const status = document.getElementById('status');

        function updateButtons() {
            drawButton.disabled = !loaded || saving;
            saveButton.disabled = !loaded || saving || drawing;
            drawButton.textContent = drawing ? 'Cancel Drawing' : 'Draw Rectangle';
        }

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 41.022892412792515, lng: -85.29945773489321 },
                zoom: 11
            });

            drawButton.addEventListener('click', startDrawingRect);
            saveButton.addEventListener('click', saveRectangles);
            map.addListener('mousedown', event => {
                if (!drawing || !event.latLng) return;
                drawingStart = event.latLng;
                currentDrawing = new google.maps.Rectangle({
                    map, clickable: false,
                    bounds: new google.maps.LatLngBounds(drawingStart, drawingStart)
                });
            });
            map.addListener('mousemove', event => {
                if (currentDrawing && event.latLng) {
                    currentDrawing.setBounds(new google.maps.LatLngBounds(drawingStart, drawingStart).extend(event.latLng));
                }
            });
            map.addListener('mouseup', event => {
                if (!currentDrawing || !event.latLng) return;
                const pointer = event.domEvent;
                if (pointer && !document.getElementById('map').contains(
                    document.elementFromPoint(pointer.clientX, pointer.clientY))) {
                    cancelDrawing();
                    return;
                }
                const rectangle = currentDrawing;
                rectangle.setBounds(new google.maps.LatLngBounds(drawingStart, drawingStart).extend(event.latLng));
                const bounds = rectangle.getBounds();
                if (bounds.getNorthEast().lat() === bounds.getSouthWest().lat()
                    || bounds.getNorthEast().lng() === bounds.getSouthWest().lng()) {
                    cancelDrawing();
                    return;
                }
                currentDrawing = null;
                cancelDrawing();
                rectangle.setOptions({ clickable: true, editable: true, draggable: true });
                finishCreatingRect(rectangle);
                editRectName(rectangle);
            });
            // Let the map's mouseup finish first; otherwise discard an outside release.
            document.addEventListener('mouseup', () => setTimeout(() => {
                if (currentDrawing) cancelDrawing();
            }, 0));
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && drawing) cancelDrawing();
            });
            window.addEventListener('blur', () => {
                if (drawing) cancelDrawing();
            });
            fetchRectangles();
        }

        async function fetchRectangles() {
            status.textContent = 'Loading rectangles…';
            try {
                const response = await fetch('get-rects');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data) || !data.every(rect => rect
                    && typeof rect.name === 'string'
                    && ['north', 'south', 'east', 'west'].every(key => Number.isFinite(rect[key]))
                    && rect.north > rect.south && rect.east > rect.west
                    && rect.north <= 90 && rect.south >= -90
                    && rect.east <= 180 && rect.west >= -180)) {
                    throw new Error('Invalid rectangle list');
                }
                const allBounds = new google.maps.LatLngBounds();
                data.forEach(rectData => {
                    const rectangle = new google.maps.Rectangle({
                        bounds: {
                            north: rectData.north,
                            south: rectData.south,
                            east: rectData.east,
                            west: rectData.west
                        },
                        editable: true,
                        draggable: true,
                        map: map
                    });

                    rectangle.name = rectData.name;
                    finishCreatingRect(rectangle);
                    allBounds.union(rectangle.getBounds());
                });
                if (data.length) map.fitBounds(allBounds);
                loaded = true;
                status.textContent = `Loaded ${data.length} rectangles.`;
            } catch (error) {
                status.textContent = `Failed to load rectangles: ${error.message}. Reload to retry.`;
            }
            updateButtons();
        }

        function startDrawingRect() {
            if (!loaded || saving) return;
            if (drawing) return cancelDrawing();
            drawing = true;
            rectangles.forEach(rect => rect.setOptions({ clickable: false, editable: false, draggable: false }));
            map.setOptions({ draggable: false, draggableCursor: 'crosshair' });
            status.textContent = 'Drag a rectangle on the map. Escape cancels.';
            updateButtons();
        }

        function cancelDrawing() {
            if (currentDrawing) currentDrawing.setMap(null);
            currentDrawing = null;
            drawingStart = null;
            drawing = false;
            rectangles.forEach(rect => rect.setOptions({ clickable: true, editable: true, draggable: true }));
            map.setOptions({ draggable: true, draggableCursor: null });
            status.textContent = 'Ready. Save Rectangles to persist changes.';
            updateButtons();
        }

        function labelContent(name) {
            const label = document.createElement('div');
            label.className = 'rectangle-label';
            label.textContent = name || '';
            return label;
        }

        function editRectName(rectangle) {
            const newName = prompt('Enter rectangle name:', rectangle.name || '');

            if (newName === null && rectangle.name ) return; // Cancel pressed

            if (newName === null || newName.trim() === '') {
                // Delete rectangle if name is empty
                rectangle.label.close();
                rectangle.setMap(null);
                rectangles = rectangles.filter(r => r !== rectangle);
            } else {
                // Update name
                rectangle.name = newName;
                rectangle.label.setContent(labelContent(newName));
                rectangle.label.open(map);
            }
        }

        function finishCreatingRect(rectangle) {
            rectangles.push(rectangle);

            // Add name label to rectangle
            rectangle.label = new google.maps.InfoWindow({
                content: labelContent(rectangle.name),
                position: rectangle.getBounds().getCenter(),
                disableAutoPan: true
            });
            rectangle.name && rectangle.label.open(map);

            rectangle.addListener('click', (event) => {
                rectangle.label.open(map);
            });

            // Double-click event to edit name
            rectangle.addListener('dblclick', (event) => {
                editRectName(rectangle);
                event.domEvent?.preventDefault();
            });

            // Update label position when rectangle moves
            rectangle.addListener('bounds_changed', () => {
                rectangle.label.setPosition(rectangle.getBounds().getCenter());
            });
        }

        function saveRectangles() {
            if (!loaded || drawing || saving) return;
            saving = true;
            updateButtons();
            const rectangleData = rectangles.map(rect => {
                const bounds = rect.getBounds();
                return {
                    name: rect.name || '',
                    north: bounds.getNorthEast().lat(),
                    south: bounds.getSouthWest().lat(),
                    east: bounds.getNorthEast().lng(),
                    west: bounds.getSouthWest().lng()
                };
            });

            fetch('update-rects', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(rectangleData)
            })
            .then(response => {
                if (response.ok) {
                    alert('Rectangles saved successfully!');
                } else {
                    alert('Failed to save rectangles.');
                }
            })
            .catch(() => {
                alert('Error saving rectangles.');
            })
            .finally(() => {
                saving = false;
                updateButtons();
            });
        }

        // Load Google Maps and initialize
        function loadScript() {
            const cookies = document.cookie.split('; ');
            const cookie = cookies.find(row => row.startsWith('googleApiKey='));
            const googleApiKey = cookie ? cookie.split('=')[1] : null;
            if (!googleApiKey || googleApiKey === 'undefined') {
                status.textContent = 'Google Maps API key is missing. Check GOOGLE_API_KEY on the server.';
                return;
            }

            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(googleApiKey)}&callback=initMap`;
            script.onerror = () => { status.textContent = 'Failed to load Google Maps. Reload to retry.'; };
            script.async = true;
            script.defer = true;
            document.body.appendChild(script);
        }

        // Expose initMap globally
        window.initMap = initMap;
        window.gm_authFailure = () => { status.textContent = 'Google Maps authentication failed. Check the API key configuration.'; };
        loadScript();
    })();
    </script>
</body>
</html>
